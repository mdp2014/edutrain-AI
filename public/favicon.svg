<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#4f46e5" />
  
  <!-- Subtle Gradient Accent -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Graduation Cap Top (Diamond) -->
  <polygon points="32,15 54,25 32,35 10,25" fill="#ffffff" />
  
  <!-- Graduation Cap Underlayer Shadow -->
  <polygon points="32,35 54,25 54,27 32,37 10,27 10,25" fill="#e0e7ff" />

  <!-- Cap Skull Base -->
  <path d="M19,30.5 L19,41 C19,45 25,48 32,48 C39,48 45,45 45,41 L45,30.5" fill="#ffffff" opacity="0.95" />
  
  <!-- Tassel Cord & Pendant -->
  <path d="M47,26 C48,31 49,36 50,40" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="42" r="2.5" fill="#f59e0b" />

  <!-- Center Button on Cap -->
  <circle cx="32" cy="25" r="2" fill="#4338ca" />

  <!-- CM2 Emerald Badge (Bottom-Right) -->
  <rect x="33" y="44" width="27" height="16" rx="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="46.5" y="55.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">CM2</text>
</svg>
