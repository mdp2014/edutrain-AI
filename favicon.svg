<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Squircle in Tech Blue -->
  <rect width="64" height="64" rx="16" fill="#0284c7" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Néo's Golden Antenna -->
  <path d="M32 18 L32 10" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="8" r="4.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="31" cy="7" r="1.2" fill="#ffffff" />

  <!-- Néo's Yellow Ear Pods -->
  <circle cx="12" cy="34" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="12" cy="34" r="2" fill="#0284c7" />
  <circle cx="52" cy="34" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="52" cy="34" r="2" fill="#0284c7" />

  <!-- Néo's White Helmet -->
  <rect x="14" y="18" width="36" height="32" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Blue Visor -->
  <rect x="18" y="23" width="28" height="20" rx="8" fill="#0369a1" stroke="#0284c7" stroke-width="1" />

  <!-- Expressive Smiling Cyan Eyes (⌒ ⌒) -->
  <path d="M22 33 Q26 27 30 33" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M34 33 Q38 27 42 33" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Cute Yellow Smile -->
  <path d="M29 38 Q32 41 35 38" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Pink Cheek Blush -->
  <circle cx="21" cy="37" r="1.5" fill="#f472b6" opacity="0.7" />
  <circle cx="43" cy="37" r="1.5" fill="#f472b6" opacity="0.7" />

  <!-- CM2 Mini Pill Badge -->
  <rect x="36" y="46" width="25" height="15" rx="5" fill="#facc15" stroke="#ffffff" stroke-width="1.2" />
  <text x="48.5" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#78350f" text-anchor="middle">CM2</text>
</svg>
