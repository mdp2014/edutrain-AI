    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="description" content="Plateforme d'entraînement scolaire personnalisée pour classe de CM2 avec suivi enseignant et exercices adaptés par Gemini." />
    <meta property="og:title" content="EduTrain AI" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <script>
      window.__loadStaticBundle = function () {
        if (window.__EDUTRAIN_LOADED__ || window.__EDUTRAIN_FALLBACK_LOADING__) return;
        window.__EDUTRAIN_FALLBACK_LOADING__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './public/gh-bundle/app.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './public/gh-bundle/app.js';
        document.body.appendChild(script);
      };
      setTimeout(function () {
        if (!window.__EDUTRAIN_LOADED__) {
          window.__loadStaticBundle();
        }
      }, 700);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx" onerror="window.__loadStaticBundle && window.__loadStaticBundle()"></script>
  </body>
